<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Kasir Pintar - Latihan 3 File</title>
    <!-- Menghubungkan file styles.css eksternal -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Kasir Pintar Kuliner</h2>
        <p class="subtitle">Simulasi Latihan Kelompok 4</p>

        <div class="menu-item">
            <span>Paket Nasi Ayam (Rp 25.000)</span>
            <button onclick="tambahPesanan(25000, 'Paket Nasi Ayam')">Pilih</button>
        </div>

        <div class="menu-item">
            <span>Es Teh Manis (Rp 5.000)</span>
            <button onclick="tambahPesanan(5000, 'Es Teh Manis')">Pilih</button>
        </div>

        <div id="total-box">
            Total Belanja: <span id="total-harga">Rp 0</span>
        </div>
    </div>

    <!-- Menghubungkan file script.js eksternal -->
    <script src="script.js"></script>
</body>
</html>
